<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STV Radiomeltdown — Now Playing</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  font-family:'DM Sans',sans-serif;
  padding:1.5rem;
  background-image:radial-gradient(ellipse at center,#1a0a00 0%,#000 70%);
}
.player-wrap{width:100%;max-width:420px;}

/* VU METER */
.vu-wrap{
  display:flex;align-items:flex-end;justify-content:center;
  gap:3px;height:40px;margin-bottom:1.5rem;
  opacity:0;transition:opacity .5s;
}
.vu-wrap.active{opacity:1;}
.vu-bar{
  width:4px;border-radius:2px;
  background:rgba(200,169,110,0.4);
  height:4px;
  transition:height .15s ease;
}
.vu-bar.red{background:rgba(232,0,45,0.5);}

/* CARD */
.player-card{
  background:#111;
  border:1px solid rgba(200,169,110,0.25);
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 0 60px rgba(200,169,110,0.06);
}

/* TOP BAR */
.player-top{
  background:#0a0806;
  border-bottom:1px solid rgba(200,169,110,0.15);
  padding:.6rem 1.25rem;
  display:flex;align-items:center;justify-content:space-between;
}
.shuffle-pill{
  display:flex;align-items:center;gap:.4rem;
  font-family:'Bebas Neue',sans-serif;
  font-size:.75rem;letter-spacing:.2em;
  color:#c8a96e;
}
.shuffle-dot{
  width:7px;height:7px;border-radius:50%;
  background:#c8a96e;
  box-shadow:0 0 8px rgba(200,169,110,.6);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.top-right{
  font-family:'Bebas Neue',sans-serif;
  font-size:.75rem;letter-spacing:.15em;
  color:rgba(200,169,110,.35);
}

/* STATION ID */
.station-id{
  padding:1.5rem 1.5rem 1rem;
  text-align:center;
  border-bottom:1px solid rgba(200,169,110,.1);
}
.station-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2rem,8vw,3rem);
  letter-spacing:.08em;color:#fff;line-height:1;
}
.station-name span{color:#c8a96e;}
.station-sub{
  font-size:9px;letter-spacing:.35em;
  text-transform:uppercase;
  color:rgba(255,255,255,.25);margin-top:.35rem;
}

/* TRACK INFO */
.track-info{
  padding:1.25rem 1.5rem;
  border-bottom:1px solid rgba(200,169,110,.1);
  min-height:80px;
}
.track-number{
  font-size:8px;letter-spacing:.3em;
  text-transform:uppercase;
  color:rgba(200,169,110,.4);margin-bottom:.35rem;
}
.track-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.6rem;letter-spacing:.06em;
  color:#fff;line-height:1.1;
}
.track-artist{
  font-size:11px;color:rgba(255,255,255,.35);
  margin-top:.25rem;letter-spacing:.05em;
}

/* PROGRESS */
.progress-wrap{padding:.75rem 1.5rem;border-bottom:1px solid rgba(200,169,110,.1);}
.progress-track{
  width:100%;height:3px;
  background:rgba(255,255,255,.08);
  border-radius:2px;position:relative;cursor:pointer;
}
.progress-fill{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,#8b6914,#c8a96e);
  width:0%;transition:width .5s linear;
  position:relative;
}
.progress-fill::after{
  content:'';position:absolute;right:-5px;top:50%;
  transform:translateY(-50%);
  width:10px;height:10px;border-radius:50%;
  background:#c8a96e;box-shadow:0 0 6px #c8a96e;
}
.time-row{
  display:flex;justify-content:space-between;
  margin-top:.4rem;
  font-size:9px;letter-spacing:.1em;
  color:rgba(255,255,255,.25);
  font-family:'Bebas Neue',sans-serif;
}

/* CONTROLS */
.controls{
  padding:1.25rem 1.5rem;
  display:flex;align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(200,169,110,.1);
}
.ctrl-btn{
  background:transparent;
  border:1px solid rgba(200,169,110,.2);
  color:rgba(200,169,110,.6);
  width:40px;height:40px;
  border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
  font-size:14px;
}
.ctrl-btn:hover{border-color:#c8a96e;color:#c8a96e;}
.ctrl-btn svg{width:16px;height:16px;fill:currentColor;}
.play-btn{
  width:56px;height:56px;border-radius:50%;
  background:#e8002d;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;
  box-shadow:0 0 20px rgba(232,0,45,.25);
}
.play-btn:hover{background:#c20025;transform:scale(1.05);}
.play-btn svg{width:20px;height:20px;fill:#fff;margin-left:2px;}
.play-btn.playing svg{margin-left:0;}
.shuffle-btn{color:rgba(200,169,110,.8) !important;border-color:rgba(200,169,110,.4) !important;}

/* VOLUME */
.vol-row{
  padding:.75rem 1.5rem 1rem;
  display:flex;align-items:center;gap:.75rem;
}
.vol-icon{color:rgba(255,255,255,.25);font-size:12px;flex-shrink:0;}
.vol-slider{
  -webkit-appearance:none;appearance:none;
  flex:1;height:3px;border-radius:2px;
  background:rgba(255,255,255,.1);outline:none;cursor:pointer;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:13px;height:13px;border-radius:50%;
  background:#c8a96e;cursor:pointer;
}
.vol-slider::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;
  background:#c8a96e;border:none;cursor:pointer;
}
.vol-pct{
  font-size:9px;letter-spacing:.1em;
  color:rgba(255,255,255,.25);
  min-width:28px;text-align:right;
  font-family:'Bebas Neue',sans-serif;
}

/* PLAYLIST */
.playlist{border-top:1px solid rgba(200,169,110,.1);}
.playlist-label{
  padding:.5rem 1.5rem;
  font-size:8px;letter-spacing:.3em;
  text-transform:uppercase;color:rgba(200,169,110,.35);
  border-bottom:1px solid rgba(255,255,255,.04);
}
.playlist-item{
  padding:.6rem 1.5rem;
  display:flex;align-items:center;gap:.75rem;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.03);
  transition:background .15s;
}
.playlist-item:hover{background:rgba(200,169,110,.04);}
.playlist-item.active{background:rgba(200,169,110,.07);}
.pi-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:.75rem;color:rgba(255,255,255,.2);
  min-width:16px;
}
.playlist-item.active .pi-num{color:#e8002d;}
.pi-title{
  font-size:12px;color:rgba(255,255,255,.6);flex:1;
}
.playlist-item.active .pi-title{color:#fff;}
.pi-dur{
  font-size:10px;color:rgba(255,255,255,.2);
  font-family:'Bebas Neue',sans-serif;
}
.pi-bar{
  width:16px;height:10px;
  display:flex;align-items:flex-end;gap:2px;
  display:none;
}
.playlist-item.active.playing .pi-bar{display:flex;}
.playlist-item.active.playing .pi-num{display:none;}
.pi-bar span{
  width:3px;border-radius:1px;background:#e8002d;
  animation:mini-vu .6s ease-in-out infinite;
}
.pi-bar span:nth-child(2){animation-delay:.2s;}
.pi-bar span:nth-child(3){animation-delay:.4s;}
@keyframes mini-vu{0%,100%{height:2px;}50%{height:8px;}}

/* LINKS */
.player-links{
  padding:.6rem 1.5rem;
  display:flex;gap:.4rem;flex-wrap:wrap;
}
.link-pill{
  font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.3);text-decoration:none;
  border:1px solid rgba(255,255,255,.07);
  padding:.2rem .55rem;border-radius:3px;
  transition:all .2s;
}
.link-pill:hover{color:#fff;border-color:rgba(200,169,110,.3);}
</style>
</head>
<body>

<div class="player-wrap">

  <div class="vu-wrap" id="vu"></div>

  <div class="player-card">

    <div class="player-top">
      <div class="shuffle-pill">
        <span class="shuffle-dot"></span>
        SHUFFLE MODE
      </div>
      <div class="top-right">G4E MOVEMENT STUDIO</div>
    </div>

    <div class="station-id">
      <div class="station-name">STV <span>RADIO</span>MELTDOWN</div>
      <div class="station-sub">Lithonia, GA &nbsp;·&nbsp; Culture. Street. Sound.</div>
    </div>

    <div class="track-info">
      <div class="track-number" id="track-number">Track 1 of 2</div>
      <div class="track-title" id="track-title">No Body</div>
      <div class="track-artist">STV Radiomeltdown</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-track" id="progress-track" onclick="scrub(event)">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-dur">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" onclick="prevTrack()" title="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>

      <button class="play-btn" id="play-btn" onclick="togglePlay()">
        <svg id="play-icon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      </button>

      <button class="ctrl-btn" onclick="nextTrack()" title="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>
    </div>

    <div class="vol-row">
      <span class="vol-icon">&#128266;</span>
      <input type="range" class="vol-slider" id="vol-slider" min="0" max="100" value="80" oninput="setVol(this.value)">
      <span class="vol-pct" id="vol-pct">80%</span>
    </div>

    <div class="playlist">
      <div class="playlist-label">Up Next — Shuffled</div>
      <div class="playlist-item active" id="pi-0" onclick="playTrack(0)">
        <div class="pi-num">1</div>
        <div class="pi-bar"><span></span><span></span><span></span></div>
        <div class="pi-title">No Body</div>
        <div class="pi-dur" id="dur-0">—</div>
      </div>
      <div class="playlist-item" id="pi-1" onclick="playTrack(1)">
        <div class="pi-num">2</div>
        <div class="pi-bar"><span></span><span></span><span></span></div>
        <div class="pi-title">Peice For Me</div>
        <div class="pi-dur" id="dur-1">—</div>
      </div>
    </div>

    <div class="player-links">
      <a href="https://kick.com/STVNETWORK" target="_blank" rel="noopener" class="link-pill">Kick</a>
      <a href="https://www.youtube.com/@STVRADIOMELTDOWN" target="_blank" rel="noopener" class="link-pill">YouTube</a>
      <a href="https://radiomeltdown.com" target="_blank" rel="noopener" class="link-pill">radiomeltdown.com</a>
      <a href="https://www.tiktok.com/@sanecatv" target="_blank" rel="noopener" class="link-pill">@SanecaTV</a>
    </div>

  </div>
</div>

<audio id="audio"></audio>

<script>
const TRACKS = [
  {file:'no-body1.mp3', title:'No Body', display:'No Body'},
  {file:'PEICEFORME.mp3', title:'Peice For Me', display:'Peice For Me'},
];

const audio = document.getElementById('audio');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const vu = document.getElementById('vu');

let currentIdx = 0;
let playing = false;
let shuffleOrder = [];
let vuInterval = null;

const PLAY = '<polygon points="5,3 19,12 5,21"/>';
const PAUSE = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';

// Build VU
for(let i=0;i<22;i++){
  const b = document.createElement('div');
  b.className='vu-bar'+(i>=18?' red':'');
  b.style.animationDelay=(Math.random()*.8)+'s';
  vu.appendChild(b);
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function init(){
  shuffleOrder = shuffle([0,1]);
  loadTrack(shuffleOrder[0]);

  // Pre-load durations
  TRACKS.forEach((t,i)=>{
    const tmp = new Audio(t.file);
    tmp.addEventListener('loadedmetadata',()=>{
      document.getElementById('dur-'+i).textContent = fmt(tmp.duration);
    });
  });
}

function loadTrack(idx){
  currentIdx = idx;
  const track = TRACKS[idx];
  audio.src = track.file;
  audio.load();
  document.getElementById('track-title').textContent = track.display;
  document.getElementById('track-number').textContent = 'Track '+(shuffleOrder.indexOf(idx)+1)+' of '+TRACKS.length;
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('time-cur').textContent='0:00';
  document.getElementById('time-dur').textContent='0:00';
  updatePlaylistUI();
}

function togglePlay(){
  if(!playing){
    audio.play().then(()=>{
      playing=true;
      playIcon.innerHTML=PAUSE;
      playBtn.classList.add('playing');
      startVU();
      updatePlaylistUI();
    }).catch(e=>console.log(e));
  } else {
    audio.pause();
    playing=false;
    playIcon.innerHTML=PLAY;
    playBtn.classList.remove('playing');
    stopVU();
    updatePlaylistUI();
  }
}

function playTrack(idx){
  playing=false;
  playBtn.classList.remove('playing');
  stopVU();
  loadTrack(idx);
  audio.play().then(()=>{
    playing=true;
    playIcon.innerHTML=PAUSE;
    playBtn.classList.add('playing');
    startVU();
    updatePlaylistUI();
  });
}

function nextTrack(){
  const pos = shuffleOrder.indexOf(currentIdx);
  const next = shuffleOrder[(pos+1)%shuffleOrder.length];
  playTrack(next);
}

function prevTrack(){
  if(audio.currentTime>3){ audio.currentTime=0; return; }
  const pos = shuffleOrder.indexOf(currentIdx);
  const prev = shuffleOrder[(pos-1+shuffleOrder.length)%shuffleOrder.length];
  playTrack(prev);
}

function updatePlaylistUI(){
  TRACKS.forEach((_,i)=>{
    const el = document.getElementById('pi-'+i);
    el.classList.toggle('active', i===currentIdx);
    el.classList.toggle('playing', i===currentIdx && playing);
  });
}

audio.addEventListener('timeupdate',()=>{
  if(!audio.duration) return;
  const pct=(audio.currentTime/audio.duration)*100;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('time-cur').textContent=fmt(audio.currentTime);
  document.getElementById('time-dur').textContent=fmt(audio.duration);
});

audio.addEventListener('loadedmetadata',()=>{
  document.getElementById('time-dur').textContent=fmt(audio.duration);
  document.getElementById('dur-'+currentIdx).textContent=fmt(audio.duration);
});

audio.addEventListener('ended',()=>{ nextTrack(); });

function scrub(e){
  const track = document.getElementById('progress-track');
  const rect = track.getBoundingClientRect();
  const pct = (e.clientX-rect.left)/rect.width;
  if(audio.duration) audio.currentTime = pct*audio.duration;
}

function setVol(val){
  audio.volume=val/100;
  document.getElementById('vol-pct').textContent=Math.round(val)+'%';
}

function fmt(s){
  if(isNaN(s)||!s) return '0:00';
  const m=Math.floor(s/60);
  const sec=Math.floor(s%60).toString().padStart(2,'0');
  return m+':'+sec;
}

function startVU(){
  vu.classList.add('active');
  vuInterval=setInterval(()=>{
    vu.querySelectorAll('.vu-bar').forEach(b=>{
      b.style.height=(4+Math.random()*32)+'px';
    });
  },120);
}

function stopVU(){
  vu.classList.remove('active');
  clearInterval(vuInterval);
  vu.querySelectorAll('.vu-bar').forEach(b=>b.style.height='4px');
}

audio.volume=0.8;
init();
</script>
</body>
</html>
